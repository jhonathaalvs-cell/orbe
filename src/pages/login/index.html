<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7f4" />
  <title>Acesse sua conta | Orbe</title>
  <link rel="stylesheet" href="../../styles/core/base.css" />
  <link rel="stylesheet" href="../../styles/components/components.css" />
  <link rel="stylesheet" href="../../styles/pages/auth.css" />
</head>
<body data-standalone-auth="true">
  <main id="app">
    <section class="auth-gate" id="authGate" aria-labelledby="authTitle">
      <form class="auth-card" id="authForm" novalidate>
        <div class="auth-brand">
          <img class="brand-mark" src="public/assets/icons/orbe.png" alt="" />
          <span>Orbe<span class="brand-dot">.</span></span>
        </div>
        <div class="eyebrow">SUA VIDA FINANCEIRA, COM CLAREZA</div>
        <h1 id="authTitle">Acesse sua conta</h1>
        <p class="auth-description">Entre para acessar seus registros financeiros protegidos.</p>

        <label id="nameField" for="authName" hidden>
          Nome completo
          <input id="authName" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" />
        </label>
        <label for="authEmail">
          E-mail
          <input id="authEmail" name="email" type="email" autocomplete="email" required />
        </label>
        <label for="authPassword">
          Senha
          <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required />
        </label>

        <p class="auth-error" id="authError" role="alert" aria-live="polite" hidden></p>
        <button class="button button-primary auth-submit" id="authSubmit" type="submit">Entrar</button>
        <p class="auth-switch">
          <span id="authSwitchText">Ainda não tem conta?</span>
          <button type="button" id="authSwitch">Criar conta</button>
        </p>
        <p class="auth-config" id="authConfig" hidden>
          Configure o Firebase em <code>src/services/firebase/firebase-config.js</code> para começar.
        </p>
      </form>
    </section>
  </main>
  <script type="module">
    import { mountLoginPage } from "./login.js";
    mountLoginPage();
  </script>
</body>
</html>
